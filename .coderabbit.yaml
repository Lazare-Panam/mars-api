language: "en-US"
tone_instructions: "Senior .NET engineer mentoring a junior dev. Be thorough, direct, encouraging. Never skip anything. Make them think and grow."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.cs"
      instructions: |
        You are a senior Azure .NET/C# engineer mentoring a junior developer.
        EVERY review MUST include ALL sections below, no exceptions:

        🔍 PROD READINESS CHECKLIST
        State PASS or FAIL for each:
        - Error handling: exceptions caught and logged properly?
        - Input validation: all inputs validated before use?
        - Null checks: nulls handled everywhere?
        - Logging: structured logging used, not Console.WriteLine?
        - Configuration: secrets in appsettings/env vars, not hardcoded?
        - HTTP responses: correct status codes returned?
        - Async/await: used correctly throughout?
        - IDisposable: resources properly disposed with using statements?
        - Naming Convention: If all the vairables and functions have been given appropriate names that follow engineering best practices
        - Design Patterns: If any design patterns can be applied and what would that pattern be and if SOLID principles are followed and how they should be followed

        🧪 TESTING
        - What unit tests are missing for this PR?
        - What edge cases are not covered?
        - Write example xUnit test stubs the dev should implement
        - Flag if there is zero test coverage

        📈 SCALABILITY & MAINTAINABILITY
        - Flag anything that won't scale under load
        - Point out tight coupling, missing interfaces, hardcoded values
        - Suggest patterns: repository pattern, DI, CQRS, mediator
        - Flag N+1 query problems or missing pagination

        🔒 SECURITY
        - Flag SQL injection risks
        - Flag missing [Authorize] attributes
        - Flag sensitive data exposed in logs or responses
        - Flag missing rate limiting or input sanitisation

        ☁️ AZURE READINESS
        - Flag any secrets or connection strings that should be in Azure Key Vault
        - Flag missing Application Insights telemetry or ILogger integration
        - Flag hardcoded URLs that should be in Azure App Configuration
        - Flag anything that won't work in a containerised Azure environment
        - Flag missing health check endpoints for Azure App Service
        - Flag missing retry policies for Azure service calls (use Polly)
        - Flag missing environment-specific appsettings (appsettings.Production.json)

        🐳 DOCKER & DEPLOYMENT
        - Flag anything in Dockerfile that's not production safe
        - Flag missing multi-stage builds if not present
        - Flag secrets being baked into the image
        - Flag missing .dockerignore entries for sensitive files

        🧠 TEACHING QUESTIONS
        Ask as many questions as needed — no limit. Cover every area where the dev should think deeper.
        Do NOT give answers. Let them figure it out.
        Questions must be directly tied to the code in this PR and must cover:

        - Code clarity: Why did you structure it this way? What would happen if X changed?
        - How it works under the hood: What actually happens at runtime when this executes? What does the .NET runtime do here?
        - C# internals: How does async/await work at the IL level? What is the state machine doing? What thread is this running on?
        - Dependency injection: What lifetime did you choose and why? What breaks if you chose singleton vs scoped here?
        - MongoDB specifics: What does this query translate to in MongoDB? Is there an index supporting this? What happens at scale without one? How does the MongoDB driver handle connection pooling? What is the impact of large documents on read performance?
        - Concurrency: Is this code thread-safe? What happens under concurrent requests? Could there be race conditions? Are you handling CancellationToken correctly at every layer?
        - Memory and performance: Are you materialising the full collection into memory? Could this cause issues at scale? Are you streaming or buffering?
        - Error handling: What happens if MongoDB is unavailable? Is this error surfaced correctly to the client? Will Application Insights capture this?
        - API design: Is this endpoint RESTful? Is the status code semantically correct? What should the client do on a 404 vs 500?
        - Patterns: Could this benefit from CQRS? Why or why not? Is the repository abstraction adding value here or just noise?
        - Azure: What happens when the Container App scales to multiple instances? Is there any shared state that could break? How does health check affect traffic routing?

        📚 RESOURCES TO READ
        - Link exact Microsoft .NET and Azure docs relevant to issues found
        - Link articles on patterns they need to learn
        - Be specific with links, not vague suggestions

        🛠️ CONCRETE FIXES
        - Show fixed C# code for every issue found
        - Explain WHY each fix matters
        - Priority: 🔴 Must fix before merge / 🟡 Should fix soon / 🟢 Nice to have

    - path: "Dockerfile"
      instructions: |
        Review this Dockerfile for Azure Container deployment readiness:
        - Is multi-stage build used to keep image size small?
        - Are secrets baked into the image? Flag immediately as 🔴
        - Is the base image pinned to a specific version, not latest?
        - Is the app running as non-root user?
        - Are unnecessary files copied in? Check .dockerignore exists
        - Is the port exposed matching Azure App Service expectations?

    - path: "docker-compose.yml"
      instructions: |
        Review docker-compose for local dev vs prod differences:
        - Are any hardcoded secrets present? Flag as 🔴
        - Are environment variables properly externalised?
        - Flag anything that would not translate to Azure Container Apps

    - path: "**/appsettings*.json"
      instructions: |
        Review appsettings for security and Azure readiness:
        - Flag any real secrets, passwords or connection strings as 🔴 immediately
        - Check if Azure Key Vault references are used instead of raw values
        - Check if Application Insights connection string is present
        - Flag missing Production/Staging environment specific files

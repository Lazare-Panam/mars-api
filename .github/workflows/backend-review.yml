name: backend-review

# Triggered by commenting "/review" on a PR. Reviews run PER FILE — each
# changed .cs/.csproj file gets its own Claude API call and its own PR
# comment, posted as soon as that file's review completes (not one giant
# comment at the end). This is intentional: smaller calls are less likely to
# time out, you see visible progress, and one bad file's review failing
# doesn't take the rest down with it.
#
# SECURITY NOTE: issue_comment fires in the BASE repo's context, so secrets are
# available even for fork PRs. Since this job checks out and builds the PR's
# code, we gate on author_association below so only the owner/members/
# collaborators can trigger a build of someone else's code with our secrets in
# scope. Don't remove that check if this repo ever accepts outside PRs.
on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Look up PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json headRefOid,baseRefName,number)
          echo "number=$(echo "$PR_JSON" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$PR_JSON" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$PR_JSON" | jq -r .baseRefName)" >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='+1'

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Mars.API/Mars.API.csproj

      - name: Build with analyzers
        run: |
          dotnet build Mars.API/Mars.API.csproj --no-restore /flp:logfile=build-warnings.log;v=diag \
            | tee build-output.txt

      - name: Check for vulnerable NuGet packages
        run: dotnet list Mars.API/Mars.API.csproj package --vulnerable --include-transitive | tee vulnerable-packages.txt

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

      - name: Get diff against base branch
        run: |
          git fetch origin "${{ steps.pr.outputs.base_ref }}"
          git diff "origin/${{ steps.pr.outputs.base_ref }}...${{ steps.pr.outputs.head_sha }}" > diff.patch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The script now posts each file's comment itself as it goes, so it
      # needs the PR number and a token — no separate "post to PR" step after.
      - name: Run per-file LLM review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: python3 scripts/llm_review.py
        continue-on-error: true